name: Build and Deploy Dioxus Web App

on:
  push:
    branches: [ mod ]
  pull_request:
    branches: [ mod ]

env:
  # 固定版本，避免上游 latest 变化导致构建漂移
  TRUNK_VERSION: "0.21.14"
  # 生产构建：让 prerender 清理 dev 专用静态资源
  WEBSITE_PROD: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        target: wasm32-unknown-unknown
        components: rustfmt, clippy

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        # 同时缓存 target/ 与 registry，避免每次全量重编译 wasm
        cache-on-failure: true

    - name: Install Trunk
      run: |
        curl -L "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
        sudo mv trunk /usr/local/bin/
        trunk --version

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy (wasm)
      run: cargo clippy --target wasm32-unknown-unknown --lib --bin web-rs --no-default-features -- -D warnings

    - name: Clippy (host tools)
      run: cargo clippy --all-targets -- -D warnings

    - name: Clippy (mini-html)
      run: cargo clippy -p mini-html --all-targets -- -D warnings

    - name: Clippy (prerender)
      run: cargo clippy -p prerender --all-targets -- -D warnings

    - name: Check font tool
      run: cargo check -p font-subset

    - name: Unit tests
      run: cargo test --workspace --exclude font-subset

    # build.rs 负责生成 static/*.json，Trunk 负责 wasm + 复制静态资源，
    # post_build hook（见 Trunk.toml）再自动生成文章预渲染页 —— 一条命令即可。
    - name: Build with Trunk
      run: trunk build --release --no-default-features

    - name: Verify prerendered pages
      run: |
        test -d dist/post
        test "$(find dist/post -name index.html | wc -l)" -gt 0
        grep -q 'class="blog-content"' dist/post/*/index.html
        grep -q "id='prerender-content'" dist/post/*/index.html
        # SSR 复用 SPA 组件：页面必须包含导航/页脚，而不是手写模板
        grep -q 'navbar-content' dist/post/*/index.html
        grep -q 'footer-content' dist/post/*/index.html
        test -d dist/series
        grep -q 'series-chapter-card' dist/series/*/index.html
        grep -q 'id="noscript-posts"' dist/index.html
        # 生产页面不应带 Trunk autoreload 占位符
        ! grep -q '__TRUNK_ADDRESS__' dist/index.html
        ! grep -q '__TRUNK_ADDRESS__' dist/404.html
        test ! -f dist/static/posts-meta.json
        echo "prerendered: $(find dist/post -name index.html | wc -l) pages"

    # 体积预算：防止后续改动把 wasm 又吹大（当前约 450 KB gzip）
    - name: Bundle size budget
      run: |
        wasm_bytes=$(gzip -c dist/*.wasm | wc -c)
        echo "wasm gzip: ${wasm_bytes} bytes"
        test "$wasm_bytes" -lt 600000

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: dist
        publish_branch: gh-pages
