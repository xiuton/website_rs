name: Build and Deploy Dioxus Web App

on:
  push:
    branches: [ mod ]
  pull_request:
    branches: [ mod ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 关键权限设置
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        target: wasm32-unknown-unknown
        
    - name: Install Trunk
      run: |
        curl -L https://github.com/thedodd/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz
        sudo mv trunk /usr/local/bin/
        trunk --version
        
    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Clean build artifacts
      run: |
        cargo clean
        
    - name: List posts directory
      run: |
        echo "=== Posts directory contents ==="
        ls -la posts/
        echo "=== Static directory before build ==="
        ls -la static/
        
    - name: Run build.rs to generate static files
      run: |
        echo "=== Running build.rs ==="
        cargo build --release --target wasm32-unknown-unknown 2>&1 | tail -20
        
    - name: List static directory after build.rs
      run: |
        echo "=== Static directory after build.rs ==="
        ls -la static/
        
    - name: Build the project with trunk
      run: |
        echo "=== Running trunk build ==="
        trunk build --release 2>&1 | tail -20
        
    - name: List static directory after trunk
      run: |
        echo "=== Static directory after trunk ==="
        ls -la static/
        echo "=== Dist static directory ==="
        ls -la dist/static/

    - name: Prerender article pages for SEO
      run: |
        echo "=== Building prerender tool ==="
        cargo build --release --bin prerender 2>&1 | tail -10
        echo "=== Prerendering static post pages ==="
        ./target/release/prerender
        echo "=== Post prerender pages ==="
        ls dist/post/ | head -20

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: dist
        publish_branch: gh-pages 