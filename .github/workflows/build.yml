name: Build and Deploy Dioxus Web App

on:
  push:
    branches: [ mod ]
  pull_request:
    branches: [ mod ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 关键权限设置
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        target: wasm32-unknown-unknown
        
    - name: Install Trunk
      run: |
        curl -L https://github.com/thedodd/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz
        sudo mv trunk /usr/local/bin/
        trunk --version
        
    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Clean build artifacts
      run: |
        cargo clean
        
    - name: List posts directory
      run: |
        echo "=== Posts directory contents ==="
        ls -la posts/
        echo "=== Static directory before build ==="
        ls -la static/
        
    - name: Build the project
      run: |
        trunk build --release
        
    - name: List static directory after build
      run: |
        echo "=== Static directory after build ==="
        ls -la static/
        echo "=== Dist static directory ==="
        ls -la dist/static/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: dist
        publish_branch: gh-pages 