    <script>
        (function() {
            var skeleton = document.getElementById('main-skeleton');
            var main = document.getElementById('main');
            if (!skeleton || !main) return;

            // 根据当前路由显示对应的骨架页
            (function() {
                var path = window.location.pathname;
                var pages = document.querySelectorAll('.sk-page[data-route]');
                var matched = false;
                for (var i = 0; i < pages.length; i++) {
                    var route = pages[i].getAttribute('data-route');
                    if (route === path || (route !== '/' && path.indexOf(route) === 0)) {
                        pages[i].classList.add('active');
                        matched = true;
                    }
                }
                if (!matched) {
                    var fallback = document.querySelector('.sk-fallback');
                    if (fallback) fallback.classList.add('active');
                }
            })();

            // Dioxus 挂载后隐藏骨架屏
            var observer = new MutationObserver(function(mutations) {
                for (var i = 0; i < mutations.length; i++) {
                    var m = mutations[i];
                    for (var j = 0; j < m.addedNodes.length; j++) {
                        var node = m.addedNodes[j];
                        if (node.id !== 'main-skeleton' && node.nodeType === 1) {
                            skeleton.classList.add('fade-out');
                            setTimeout(function() { skeleton.remove(); }, 300);
                            observer.disconnect();
                            return;
                        }
                    }
                }
            });
            observer.observe(main, { childList: true });

            // 兜底：10 秒后强制隐藏
            setTimeout(function() {
                if (skeleton.parentNode) {
                    skeleton.classList.add('fade-out');
                    setTimeout(function() { skeleton.remove(); }, 300);
                    observer.disconnect();
                }
            }, 10000);
        })();
    </script>
