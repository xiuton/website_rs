[package]
name = "web-rs"
version = "0.1.0"
edition = "2021"

[features]
default = ["dev-pages"]
dev-pages = []

[dependencies]
dioxus = { version = "0.6.3", features = ["web", "router"] }
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.89"
wasm-bindgen-futures = "0.4.39"
web-sys = { version = "0.3.66", features = [
    "Document",
    "Element",
    "HtmlElement",
    "Window",
    "Storage",
    "Location",
    "Url",
    "UrlSearchParams",
    "History",
    "HtmlImageElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    ] }
js-sys = "0.3.66"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
toml = "0.8.8"
comrak = "0.20.0"
futures-channel = "0.3.30"
gloo-net = "0.5.0"
wee_alloc = "0.4.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = "0.4.31"

[build-dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
