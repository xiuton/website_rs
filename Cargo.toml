[package]
name = "web-rs"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    ".",
    "crates/site-model",
    "crates/site-content",
    "crates/site-data",
    "apps/prerender",
    "tools/font-subset",
    "tools/mini-html",
    "tools/xtask",
]
resolver = "2"

[features]
default = ["dev-pages"]
dev-pages = []

[dependencies]
dioxus = { version = "0.7.10", features = ["web", "router"] }
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "Document",
    "Element",
    "HtmlElement",
    "Window",
    "Storage",
    "Location",
    "Url",
    "UrlSearchParams",
    "History",
    "HtmlImageElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    ] }
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
futures-channel = "0.3.34"
gloo-net = "0.7.0"
site-model = { path = "crates/site-model" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = "0.4.45"

[build-dependencies]
site-content = { path = "crates/site-content" }
site-data = { path = "crates/site-data" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
